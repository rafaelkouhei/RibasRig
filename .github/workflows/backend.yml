name: Back-end
# Roda quando muda o back-end (ou este arquivo): check --deploy, migrações pendentes e pytest num PostgreSQL 17.
on:
  push:
    branches: [main]
    paths: ['ribasrig-backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['ribasrig-backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: ribasrig-backend
jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ribasrig
          POSTGRES_USER: ribasrig
          POSTGRES_PASSWORD: ribasrig-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ribasrig" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://ribasrig:ribasrig-ci@localhost:5432/ribasrig
      DJANGO_SECRET_KEY: chave-so-para-o-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ribasrig-backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
