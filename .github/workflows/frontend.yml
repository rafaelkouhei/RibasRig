name: Front-end
# Roda quando muda o front (ou este arquivo): tipos, testes, build e auditoria das dependências que vão para o app.
on:
  push:
    branches: [main]
    paths: ['ribasrig-frontend/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['ribasrig-frontend/**', '.github/workflows/frontend.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: ribasrig-frontend
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ribasrig-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Falha só com vulnerabilidade alta nas dependências que vão para o app
      - run: npm audit --omit=dev --audit-level=high
